<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="pilot-token" content="__PILOT_TOKEN__"><title>员工2微信连接</title><style>body{font:16px/1.7 system-ui,sans-serif;color:#173041;background:#f4f7f8;max-width:620px;margin:40px auto;padding:0 20px}main{background:white;border-radius:16px;padding:28px;box-shadow:0 5px 25px #18333c12}button{background:#13745d;color:white;border:0;border-radius:8px;padding:12px 20px;font-size:16px;cursor:pointer}img{display:block;max-width:240px;margin:20px 0}small{color:#50656a}</style></head><body><main><h1>连接员工 2 微信</h1><p>使用员工 2 的微信扫码并在手机上确认。此连接与原有微信分开保存。</p><button id="connect">连接员工 2 微信 / 刷新二维码</button><p id="status">正在查看连接状态…</p><img id="qr" alt="员工2微信扫码二维码" hidden><small>连接后，请用员工 2 微信按任务消息中的指令回复。</small></main><script>
const token=document.querySelector('meta[name="pilot-token"]').content;
async function status(){try{const r=await fetch('/api/wechat2/status',{headers:{'X-Pilot-Token':token}});const v=await r.json();const s=v.login;document.querySelector('#status').textContent=s.detail||s.state;const img=document.querySelector('#qr');img.hidden=s.state!=='waiting_scan';if(!img.hidden)img.src='/wechat2-qr.png?v='+(s.qr_version||'1');if(v.channel.bound&&v.channel.gateway_listening)document.querySelector('#status').textContent='员工 2 微信已授权，通道已启动。请等待员工 2 的任务消息。'}catch(e){document.querySelector('#status').textContent='暂时无法连接本机助理。'}}
document.querySelector('#connect').onclick=async()=>{await fetch('/api/wechat2/connect',{method:'POST',headers:{'X-Pilot-Token':token,'Content-Type':'application/json'},body:'{}'});await status()};status();setInterval(status,2000);
</script></body></html>
