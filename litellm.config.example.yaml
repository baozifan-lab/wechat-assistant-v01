# 模板：替换实际模型名和供应商地址后再使用。
# 这里只展示 OpenAI 兼容端点；原生 Anthropic/Gemini 等使用各自适配器配置。
# API_BASE 示例：https://your-approved-model-provider/v1
model_list:
  - model_name: reminder-fast
    litellm_params:
      model: openai/REPLACE_WITH_FAST_MODEL
      api_base: os.environ/FAST_API_BASE
      api_key: os.environ/FAST_API_KEY
  - model_name: planner-strong
    litellm_params:
      model: openai/REPLACE_WITH_STRONG_MODEL
      api_base: os.environ/STRONG_API_BASE
      api_key: os.environ/STRONG_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# 企业应用给本服务发单独的虚拟密钥，限制可用模型与预算。
# 不要把 master_key 配给员工或暴露到浏览器。
